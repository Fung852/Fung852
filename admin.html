<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 清风空调清洗</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loginPage" class="admin-login">
        <div class="login-box">
            <h1>管理后台</h1>
            <form id="loginForm">
                <input type="text" name="username" placeholder="用户名" required>
                <input type="password" name="password" placeholder="密码" required>
                <button type="submit">登录</button>
            </form>
        </div>
    </div>

    <div id="adminPage" class="admin-page" style="display: none;">
        <header class="admin-header">
            <h1>工单管理</h1>
            <div class="admin-actions">
                <select id="filterStatus">
                    <option value="">全部状态</option>
                    <option value="pending">待确认</option>
                    <option value="confirmed">已确认</option>
                    <option value="completed">已完成</option>
                    <option value="cancelled">已取消</option>
                </select>
                <input type="date" id="filterDateFrom" placeholder="开始日期">
                <input type="date" id="filterDateTo" placeholder="结束日期">
                <button id="btnRefresh">刷新</button>
                <button id="btnLogout">退出</button>
            </div>
        </header>
        <main class="admin-main">
            <div class="bookings-table-wrap">
                <table class="bookings-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>客户</th>
                            <th>电话</th>
                            <th>服务</th>
                            <th>数量</th>
                            <th>日期/时段</th>
                            <th>地址</th>
                            <th>状态</th>
                            <th>支付</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>编辑工单</h3>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>状态</label>
                    <select id="editStatus">
                        <option value="pending">待确认</option>
                        <option value="confirmed">已确认</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>指派技师</label>
                    <input type="text" id="editAssigned" placeholder="技师姓名">
                </div>
                <div class="form-group">
                    <label>支付状态</label>
                    <select id="editPayment">
                        <option value="unpaid">未支付</option>
                        <option value="paid">已支付</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCloseModal">取消</button>
                    <button type="submit" class="btn-save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
